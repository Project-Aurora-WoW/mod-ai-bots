name: core-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: mod-ai-bots

      - name: Checkout AzerothCore
        uses: actions/checkout@v4
        with:
          repository: azerothcore/azerothcore-wotlk
          ref: master
          path: azerothcore-wotlk

      - name: Place module
        run: cp -r mod-ai-bots azerothcore-wotlk/modules/mod-ai-bots

      # Набор зависимостей повторяет официальный linux-build AzerothCore:
      # Boost обязателен, без libboost-all-dev конфигурация падает.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential ccache cmake cmake-data curl make unzip \
            libboost-all-dev libbz2-dev libmysql++-dev libreadline6-dev \
            libssl-dev libtool openssl zlib1g-dev \
            google-perftools libmysqlclient-dev libncurses5-dev

      - name: Configure
        run: |
          cmake -S azerothcore-wotlk -B build \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPPS_BUILD=all \
            -DTOOLS_BUILD=none \
            -DSCRIPTS=static \
            -DMODULES=static

      - name: Build
        run: cmake --build build --config Release -j "$(($(nproc) + 2))"
